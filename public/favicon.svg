<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Instagram style multi-stop vibrant ring gradient -->
    <linearGradient id="instaGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="25%" stop-color="#FF4E00" />
      <stop offset="60%" stop-color="#E80075" />
      <stop offset="85%" stop-color="#BD00C4" />
      <stop offset="100%" stop-color="#8000D7" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Playfair+Display:ital,wght@0,600;1,400&amp;family=Montserrat:wght@600&amp;display=swap');
      .pink-c {
        font-family: 'Playfair Display', Didot, 'Times New Roman', serif;
        font-size: 340px;
        font-weight: 600;
        fill: #F3A4A9;
      }
      .signature {
        font-family: 'Alex Brush', 'Great Vibes', 'Brush Script MT', cursive;
        font-size: 110px;
        fill: #141414;
      }
      .subtext {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 9px;
        fill: #3E3E3E;
      }
    </style>
  </defs>

  <!-- Container dark background -->
  <rect width="512" height="512" rx="115" fill="#0F0F12" />

  <!-- Outer Gradient Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#instaGradient)" stroke-width="18" />

  <!-- Inner White Circle -->
  <circle cx="256" cy="256" r="212" fill="#FFFFFF" />

  <!-- Large Soft Pink Serif C -->
  <text x="252" y="362" text-anchor="middle" class="pink-c">C</text>

  <!-- Cursive Signature Camila Lima -->
  <text x="256" y="264" text-anchor="middle" class="signature">Camila Lima</text>

  <!-- Subtitle NAIL DESIGNER -->
  <text x="260" y="382" text-anchor="middle" class="subtext">NAIL DESIGNER</text>
</svg>